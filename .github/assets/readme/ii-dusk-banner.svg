<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1538"/>
      <stop offset="1" stop-color="#2a1d45"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <g transform="translate(40 40) scale(0.42)">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1538"/>
      <stop offset="0.6" stop-color="#4a2a5c"/>
      <stop offset="1" stop-color="#c0606a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb36b" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="500" cy="500" r="500"/></clipPath>
    </defs>
  <g clip-path="url(#disc)">
    <rect width="1000" height="1000" fill="url(#sky)"/>
    <circle cx="480" cy="390" r="260" fill="url(#glow)"/>
    <!-- the emblem: the original two i's, scaled 0.6, horizon at y=600 -->
    <g transform="translate(200 132) scale(0.6)">
      <g fill="#f6ecdf">
        <path d="M 352 780 V 480 a 48 48 0 0 1 96 0 V 780 Z"/>
        <path d="M 552 780 V 480 a 48 48 0 0 1 96 0 V 780 Z"/>
        <circle cx="400" cy="340" r="60"/>
      </g>
      <circle cx="600" cy="340" r="60" fill="#ffd08a"/>
    </g>
    <rect y="600" width="1000" height="400" fill="#161030"/>
  </g>
