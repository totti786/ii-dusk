<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1538"/>
      <stop offset="0.6" stop-color="#4a2a5c"/>
      <stop offset="1" stop-color="#c0606a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd08a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#sky)"/>
  <!-- the setting sun's glow, centred on the amber tittle -->
  <circle cx="480" cy="126" r="230" fill="url(#glow)"/>
  <!-- the original mark, scaled 0.6 and placed on the horizon at y=390 (horizon band below) -->
  <g transform="translate(120 -78) scale(0.6)">
    <g fill="#f6ecdf">
      <path d="M 352 780 V 480 a 48 48 0 0 1 96 0 V 780 Z"/>
      <path d="M 552 780 V 480 a 48 48 0 0 1 96 0 V 780 Z"/>
      <circle cx="400" cy="340" r="60"/>
    </g>
    <circle cx="600" cy="340" r="60" fill="#ffd08a"/>
  </g>
  <rect y="390" width="1600" height="110" fill="#161030"/>
</svg>
