[package]
name = "mediator"
version = "0.1.0"
edition = "2021"
description = "Mediator media launcher (Rust rewrite, in progress)"

[[bin]]
name = "mediator-rs"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
ureq = "3.5.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
fancy-regex = "0.20.0"
unicode-normalization = "0.1.26"
sha2 = "0.11.1"
shlex = "2.0.1"
html-escape = "0.3.0"
base64 = "0.23.1"
url = "2.5.8"
percent-encoding = "2.3.2"
md-5 = "0.11.0"
roxmltree = "0.21.2"
clap = { version = "4.6.7", features = ["derive"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
