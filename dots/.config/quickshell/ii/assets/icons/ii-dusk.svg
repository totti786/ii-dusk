<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1538"/>
      <stop offset="0.6" stop-color="#4a2a5c"/>
      <stop offset="1" stop-color="#c0606a"/>
    </linearGradient>
    <clipPath id="tile"><circle cx="500" cy="500" r="500"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1000" height="1000" fill="url(#sky)"/>
    <rect y="780" width="1000" height="220" fill="#161030"/>
  </g>
  <!-- two i's standing on the horizon; the right tittle is the setting sun -->
  <g fill="#f6ecdf">
    <path d="M 352 780 V 480 a 48 48 0 0 1 96 0 V 780 Z"/>
    <path d="M 552 780 V 480 a 48 48 0 0 1 96 0 V 780 Z"/>
    <circle cx="400" cy="340" r="60"/>
  </g>
  <circle cx="600" cy="340" r="60" fill="#ffd08a"/>
</svg>
