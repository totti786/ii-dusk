[config]
version_check = false

# Hues KDE needs for positive and neutral text, blended toward the wallpaper like the M3 accents.
[config.custom_colors]
kde_positive = "#43A047"
kde_neutral = "#FB8C00"

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.pywal]
input_path = '~/.config/matugen/templates/pywal.json'
output_path = '~/.cache/wal/colors.json'
post_hook = '$HOME/.config/quickshell/ii/scripts/colors/switchwall.sh --matugen'

[templates.kde]
input_path = '~/.config/matugen/templates/kde/kdeglobals'
output_path = '~/.local/state/quickshell/user/generated/kdeglobals'
post_hook = 'python3 $HOME/.config/quickshell/ii/scripts/colors/kde_colors.py'

[templates.zathura]
input_path = '~/.config/matugen/templates/zathura/zathurarc'
output_path = '~/.config/zathura/zathurarc'

[templates.sioyek]
input_path = '~/.config/matugen/templates/sioyek/prefs_user.config'
output_path = '~/.config/sioyek/prefs_user.config'
post_hook = 'python3 $HOME/.config/quickshell/ii/scripts/colors/hex_to_floats.py ~/.config/sioyek/prefs_user.config'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# FlatColor, the GTK3/GTK2 theme. Written straight into the theme folder.
[templates.flatcolor_gtk3]
input_path = '~/.config/matugen/templates/flatcolor/gtk-3.0.css'
output_path = '~/.local/share/themes/FlatColor/gtk-3.0/gtk.css'

[templates.flatcolor_gtk320]
input_path = '~/.config/matugen/templates/flatcolor/gtk-3.20.css'
output_path = '~/.local/share/themes/FlatColor/gtk-3.20/gtk.css'

[templates.flatcolor_gtk2]
input_path = '~/.config/matugen/templates/flatcolor/gtk-2.0rc'
output_path = '~/.local/share/themes/FlatColor/gtk-2.0/gtkrc'
