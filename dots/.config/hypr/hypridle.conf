# Generated by the shell: Settings > Power & Battery > When idle. Edits here are overwritten.
$lock_cmd = pidof qs quickshell >/dev/null && hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || ~/.config/hypr/hyprlock/lockscreen

general {
	lock_cmd = $lock_cmd
	inhibit_sleep = 3
	# Release an in-flight fingerprint read first: suspending mid-read crashes some readers' drivers.
	before_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFingerStop")' ; loginctl lock-session     # lock before suspend.
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
}

listener {
	timeout = 60
	on-timeout = if [ "$(qs -c ii ipc call lock locked 2>/dev/null)" = true ]; then hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'; fi
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
	timeout = 300
	on-timeout = if [[ "$(brightnessctl -m | cut -d "," -f4 | tr -d "%")" -ge "20" ]]; then brightnessctl s 20%- ;fi
	on-resume = if [[ "$(brightnessctl -m | cut -d "," -f4 | tr -d "%")" -ge "20" ]]; then brightnessctl s 20%+ ;fi
}

listener {
	timeout = 600
	on-timeout = loginctl lock-session
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
	timeout = 602
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
	timeout = 1200
	on-timeout = ! grep -qx 1 /sys/class/power_supply/*/online && systemctl suspend
}
