$lock_cmd = pidof qs quickshell >/dev/null && hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || lockscreen
$suspend_cmd = [[ $(cat /sys/class/power_supply/BAT*/status) == "Discharging" ]] && systemctl suspend

general {
	lock_cmd = $lock_cmd
	inhibit_sleep = 3
	# Release an in-flight fingerprint read first: suspending mid-read crashes some readers' drivers.
	before_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFingerStop")' ; loginctl lock-session     # lock before suspend.
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
}

listener {
	timeout = 60
	on-timeout = if pgrep hyprlock; then hyprctl dispatch 'hl.dsp.dpms({ action = "off" })';fi
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
	timeout = 300
	on-timeout = if [[ "$(brightnessctl -m | cut -d "," -f4 | tr -d "%")" -ge "20" ]]; then brightnessctl s 20%- ;fi
	on-resume = if [[ "$(brightnessctl -m | cut -d "," -f4 | tr -d "%")" -ge "20" ]]; then brightnessctl s 20%+ ;fi
}

listener {
	timeout = 600
	on-timeout = loginctl lock-session
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
	timeout = 602
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1200
    on-timeout = $suspend_cmd
}
